<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>dope2000 LIVE通知</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#101010; color:#fff; display:flex; justify-content:center; }
    main { width:min(100%,480px); padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); }
    .tag { color:#aaa; font-size:12px; letter-spacing:.12em; }
    h1 { font-size:30px; line-height:1.15; margin:10px 0 26px; }
    .panel { background:#1c1c1e; border:1px solid #333; border-radius:22px; padding:22px; margin:16px 0; }
    .user { font-size:27px; font-weight:750; margin:8px 0 18px; }
    .status { display:flex; align-items:center; gap:9px; color:#bbb; font-size:14px; }
    .dot { width:10px; height:10px; border-radius:50%; background:#777; }
    .dot.live { background:#ff334f; box-shadow:0 0 14px #ff334f; }
    button { width:100%; border:0; border-radius:15px; padding:17px; font-size:16px; font-weight:700; color:white; background:#e52d48; margin-top:18px; }
    button:disabled { opacity:.55; }
    .muted { color:#999; font-size:12px; line-height:1.6; }
    a { color:#ff7184; }
    #message { min-height:22px; font-size:13px; color:#ffb7c0; margin-top:12px; }
    .small { font-size:13px; color:#bbb; line-height:1.7; }
  </style>
</head>
<body>
<main>
  <div class="tag">LIVE ALERT / IPHONE</div>
  <h1>配信開始を、<br>見逃さない。</h1>
  <section class="panel">
    <div class="tag">監視アカウント</div>
    <div class="user">@dope2000</div>
    <div class="status"><span class="dot" id="dot"></span><span id="liveStatus">状態を確認中…</span></div>
    <button id="enable">通知を有効にする</button>
    <div id="message"></div>
  </section>
  <section class="panel">
    <div class="tag">使い方</div>
    <p class="small">1. Safariでこのページを開く<br>2. 共有ボタン →「ホーム画面に追加」<br>3. ホーム画面のアイコンから起動<br>4.「通知を有効にする」を押して許可</p>
  </section>
  <p class="muted">通知にはiOS 16.4以降・HTTPS・ホーム画面への追加が必要です。TikTokの非公式監視を利用するため、検知の遅延や停止が発生する場合があります。</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let config;
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function init() {
  config = await fetch('/api/config').then(r => r.json());
  document.querySelector('.user').textContent = '@' + config.username;
  if ('serviceWorker' in navigator) await navigator.serviceWorker.register('/static/sw.js');
  await refresh();
  setInterval(refresh, 15000);
}
async function refresh() {
  try {
    const s = await fetch('/api/status').then(r => r.json());
    $('dot').classList.toggle('live', !!s.is_live);
    $('liveStatus').textContent = s.is_live ? 'LIVEを検知中' : (s.last_error ? '監視に接続できていません' : '待機中');
  } catch (_) { $('liveStatus').textContent = 'サーバーに接続できません'; }
}
$('enable').addEventListener('click', async () => {
  const msg = $('message');
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      throw new Error('この環境はWebプッシュ通知に対応していません。iOS 16.4以降のSafariでホーム画面から開いてください。');
    }
    if (!config.vapidPublicKey) throw new Error('サーバー側の通知設定がまだ完了していません。');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') throw new Error('通知が許可されませんでした。iPhoneの設定を確認してください。');
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(config.vapidPublicKey)
    });
    await fetch('/api/subscribe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription})
    });
    msg.textContent = '通知を登録しました。LIVE開始を待機します。';
    $('enable').textContent = '通知 ON';
    $('enable').disabled = true;
  } catch (e) { msg.textContent = e.message; }
});
init().catch(e => $('message').textContent = e.message);
</script>
</body>
</html>
